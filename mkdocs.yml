site_name: Harness Engineering Guide
site_url: https://marcosdh1987.github.io/harness-engineering-guide/
repo_url: https://github.com/marcosdh1987/harness-engineering-guide
repo_name: marcosdh1987/harness-engineering-guide
docs_dir: docs
site_dir: site
theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.path
    - navigation.top
    - toc.follow
    - content.code.copy
plugins:
  - search
markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - tables
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.arithmatex:
      generic: true
extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
extra:
  alternate:
    - name: English
      link: en/
      lang: en
    - name: Español
      link: es/
      lang: es

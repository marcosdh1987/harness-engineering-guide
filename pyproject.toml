[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "harness-engineering-guide"
version = "0.1.0"
description = "Bilingual MkDocs guide for Harness Engineering in AI-assisted software development."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "mkdocs==1.6.1",
  "mkdocs-material==9.7.6",
]

[tool.setuptools]
py-modules = []

[dependency-groups]
dev = [
  "ruff>=0.14",
]

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = ["site", ".venv"]

[tool.ruff.lint]
# Pragmatic baseline for a docs repo whose only Python is the reference sync script.
select = ["E", "W", "F", "I", "UP", "RUF"]
ignore = [
  "E501",    # line length is handled by the formatter
  "RUF015",  # next(iter(x)) rewrite — unsafe fix; not worth changing a load-bearing script
  "W291",    # a lone hit is trailing whitespace inside generated-markdown string data
]

name: Docs Check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  docs-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install . pytest ruff

      - name: Check code formatting and lint
        run: |
          ruff check scripts tests
          ruff format --check scripts tests

      - name: Run unit tests
        run: pytest tests

      - name: Check reference drift
        run: python scripts/check_reference_drift.py

      - name: Check prose style
        run: python scripts/check_prose_style.py --strict docs README.md

      - name: Build documentation
        run: mkdocs build --strict

